apply plugin: 'com.android.library'

android {
    namespace = 'de.dennisguse.opentracks'

    compileOptions {
        coreLibraryDesugaringEnabled = true

        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    compileSdk = 36

    buildFeatures {
        viewBinding = true
        buildConfig = true
    }

    defaultConfig {
        versionCode 6284
        versionName "v4.22.0"

        minSdk = 26
        targetSdk = 36

        testInstrumentationRunner 'de.dennisguse.opentracks.TestRunner'
        testInstrumentationRunnerArguments clearPackageData: 'true'

        buildConfigField "String", "APPLICATION_ID", "\"com.duo.sports.onlyrun.debug\""
        buildConfigField "String", "VERSION_NAME_FULL", "\"v4.22.0\""
        buildConfigField "int", "VERSION_CODE", "6284"
        buildConfigField "String", "VERSION_NAME", "\"v4.22.0\""
        resValue "string", "applicationId", "com.duo.sports.onlyrun.debug"
    }

    buildTypes {
        release {
            crunchPngs = false
            minifyEnabled = false
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.documentfile:documentfile:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core:1.17.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'androidx.core:core-location-altitude:1.0.0-alpha03'

    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    androidTestImplementation 'org.mockito:mockito-android:5.19.0'

    androidTestUtil 'androidx.test:orchestrator:1.6.1'
}
